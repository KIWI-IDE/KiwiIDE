import groovy.json.JsonOutput
import java.lang.reflect.Modifier
import org.gradle.api.Project
import org.gradle.api.Task

// Export names and signatures only. No extension properties or credentials
// are evaluated to discover their values.
class KiwiEditorTypes {
    Map types = [:]
    Set skipped = ['getClass', 'getMetaClass', 'setMetaClass', 'wait', 'notify', 'notifyAll', 'equals', 'hashCode', 'toString', 'invokeMethod', 'getProperty', 'setProperty'] as Set

    String add(Class type, int depth = 0) {
        if (type == null || type.primitive || types.containsKey(type.name) || types.size() >= 180) return type?.name ?: ''
        def rows = [:]
        types[type.name] = []
        type.methods.findAll { Modifier.isPublic(it.modifiers) && !Modifier.isStatic(it.modifiers) && !it.synthetic && !skipped.contains(it.name) }.sort { it.name }.take(700).each { method ->
            def names = method.parameters.toList().withIndex().collect { pair ->
                def parameter = pair[0]
                [name: parameter.namePresent ? parameter.name : "arg${pair[1] + 1}", type: parameter.parameterizedType.typeName]
            }
            def entry = [name: method.name, kind: 'method', type: method.genericReturnType.typeName, returns: method.returnType.name, parameters: names, signature: "${method.name}(${names.collect { it.type }.join(', ')}) : ${method.genericReturnType.typeName}"]
            rows["m:${entry.signature}"] = entry
            if (method.parameterCount == 0 && method.returnType != Void.TYPE && method.name.startsWith('get') && method.name.length() > 3) {
                def name = method.name.substring(3)
                name = name[0].toLowerCase() + name.substring(1)
                rows["p:${name}"] = [name: name, kind: 'property', type: entry.type, returns: entry.returns, parameters: [], signature: "${name} : ${entry.type}"]
            }
            if (method.parameterCount == 0 && method.returnType == Boolean.TYPE && method.name.startsWith('is')) {
                rows["p:${method.name}"] = [name: method.name, kind: 'property', type: 'boolean', returns: 'boolean', parameters: [], signature: "${method.name} : boolean"]
            }
        }
        types[type.name] = rows.values().toList()
        if (depth < 2) {
            type.methods.findAll { it.parameterCount == 0 && !it.returnType.primitive && !it.returnType.name.startsWith('java.') && !it.returnType.name.startsWith('groovy.') && !it.returnType.name.startsWith('kotlin.') }.take(80).each { add(it.returnType, depth + 1) }
        }
        return type.name
    }
}

gradle.projectsEvaluated {
    def taskName = System.getProperty('kiwi.editor.task', '_kiwiEditorModel')
    gradle.rootProject.tasks.register(taskName) {
        doLast {
            def collector = new KiwiEditorTypes()
            collector.add(Project, 2)
            collector.add(Task, 2)
            collector.add(org.gradle.api.tasks.TaskContainer, 2)
            collector.add(org.gradle.api.plugins.ExtensionContainer, 2)
            collector.add(org.gradle.api.artifacts.dsl.DependencyHandler, 2)
            collector.add(org.gradle.api.artifacts.ExternalModuleDependency, 2)
            def projects = gradle.rootProject.allprojects.collect { project ->
                def extensions = project.extensions.extensionsSchema.collect { schema -> [name: schema.name, type: collector.add(schema.publicType.concreteClass)] }
                def tasks = project.tasks.findAll { !it.name.startsWith('_kiwiEditor') }.take(250).collect { task ->
                    def type = task.class
                    while (type.name.endsWith('_Decorated') && type.superclass != null) type = type.superclass
                    [name: task.name, path: task.path, type: collector.add(type), description: task.description ?: '']
                }
                [path: project.path, directory: project.projectDir.absolutePath, extensions: extensions, tasks: tasks, configurations: project.configurations.names.toList().sort()]
            }
            println('KIWI_GRADLE_MODEL:' + JsonOutput.toJson([schema: 1, gradleVersion: gradle.gradleVersion, projects: projects, types: collector.types]))
        }
    }
}
